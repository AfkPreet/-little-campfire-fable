    <meta property="og:title" content="Little Monsoon" />
    <meta property="og:description" content="Little Monsoon: a tiny, cozy camping trip. Fish, forage, cook by the fire, and meet the gentle guardian of the water." />

    <title>Little Monsoon</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2F3558; }
      body {
        position: fixed; inset: 0;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Baloo 2", system-ui, sans-serif;
      }
      #app { position: fixed; inset: 0; width: 100%; height: 100%; }
      #app canvas { display: block; image-rendering: auto; }
      #rotate {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: #2F3558; color: #F6EFE6; z-index: 50; flex-direction: column; gap: 12px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #rotate .card { background: #F6EFE6; color: #4A4250; border-radius: 20px; padding: 20px 28px; text-align: center;
        box-shadow: 0 4px 12px rgba(74,66,80,0.15); font-size: 20px; }
      #rotate canvas { width: 120px; height: 120px; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate"><canvas id="rotate-hero" width="240" height="240"></canvas><div class="card">Turn your device sideways</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
